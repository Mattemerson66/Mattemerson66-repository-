<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Invisible Good</title>
  <style>
    :root { --bg: #f6f1e7; --ink: #2b2622; --muted: #7a6f63; --accent: #b5653d; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1c1916; --ink: #ece4d6; --muted: #a3978a; --accent: #d98c62; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
      font: 17px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    h1 { font-family: ui-serif, "New York", Georgia, serif; font-size: 26px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 20px; }
    a { display: inline-block; background: var(--accent); color: var(--bg); text-decoration: none; font-weight: 600;
      padding: 14px 22px; border-radius: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>The app has been updated</h1>
    <p>That link was from an older version. Head back and try again. You'll get the new version.</p>
    <a id="home" href="/">Back to the journal</a>
  </main>
  <script>
    // Project sites live under /<repo-name>/, so send people to that folder.
    var first = location.pathname.split('/')[1];
    if (first && first.indexOf('.') === -1) document.getElementById('home').href = '/' + first + '/';

    // Landing here usually means an old copy of the app is stuck in the
    // offline cache. Clear it (journal entries live elsewhere and are kept) so
    // the link above loads the current version.
    try {
      if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations()
        .then(function (regs) { regs.forEach(function (r) { r.unregister(); }); }).catch(function () {});
      if (window.caches) caches.keys()
        .then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); }).catch(function () {});
    } catch (e) {}
  </script>
</body>
</html>
